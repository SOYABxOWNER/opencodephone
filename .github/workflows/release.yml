name: Release

# Fully automatic releases:
#   * every push to main → the workflow computes the next version itself,
#     tags the commit and publishes two signed builds:
#       - v0.1.4          stable release (Latest)  — in-app updater channel
#       - v0.1.4-dev.N    dev pre-release          — OpenCodePhone Dev app
#   * pushing a vX.Y.Z tag manually → builds exactly that version (no dev build);
#   * workflow_dispatch → same as push to main, with an optional fixed version.
#
# APK naming is fixed by the in-app updater (ui/update/ReleasePolicy.kt):
#   OpenCodePhone-v0.1.4-arm64-v8a.apk  (and armeabi-v7a / x86_64).
# The digest-pinned toolset-<arch>.tar.gz bundles stay on the v0.1.1 release
# (Pins.TOOLSET_URL_PREFIX) and are deliberately not rebuilt per release.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version, e.g. 0.2.0 (empty = auto-bump from the latest tag)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Compute versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      stable_tag: ${{ steps.ver.outputs.stable_tag }}
      stable_code: ${{ steps.ver.outputs.stable_code }}
      dev_tag: ${{ steps.ver.outputs.dev_tag }}
      dev_code: ${{ steps.ver.outputs.dev_code }}
    steps:
      - name: Checkout (full history, tags included)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick the next stable version and tag names
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            # Manual tag push: build exactly this version, no dev build.
            BASE="${REF_NAME#v}"
            DEV_TAG=""
          else
            if [ -n "${INPUT_VERSION:-}" ]; then
              BASE="${INPUT_VERSION#v}"
            else
              # Next stable = max(latest vX.Y.Z tag, versionName in the repo) + patch bump.
              LATEST_TAG=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
              LATEST="${LATEST_TAG#v}"
              REPO_VER=$(grep -oE 'versionName[^"]*"[0-9]+\.[0-9]+\.[0-9]+"' app/build.gradle.kts \
                | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)
              BASE=$(printf '%s\n%s\n' "$LATEST" "$REPO_VER" | sed '/^$/d' | sort -V | tail -n1)
              MAJOR=${BASE%%.*}; REST=${BASE#*.}; MINOR=${REST%%.*}; PATCH=${REST#*.}
              BASE="${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi
            DEV_TAG="v${BASE}-dev.${RUN_NUMBER}"
          fi
          if ! printf '%s' "$BASE" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must be X.Y.Z (got '${BASE}'). Dev tags (vX.Y.Z-dev.N) are created by this workflow itself."
            exit 1
          fi
          echo "Next stable version: ${BASE} (versionCode $((RUN_NUMBER * 10 + 2)))"
          echo "stable_tag=v${BASE}" >> "$GITHUB_OUTPUT"
          echo "stable_code=$((RUN_NUMBER * 10 + 2))" >> "$GITHUB_OUTPUT"
          echo "dev_tag=${DEV_TAG}" >> "$GITHUB_OUTPUT"
          echo "dev_code=$((RUN_NUMBER * 10 + 1))" >> "$GITHUB_OUTPUT"

  dev:
    name: Signed dev pre-release APKs
    runs-on: ubuntu-latest
    needs: version
    if: needs.version.outputs.dev_tag != ''
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          test -s /tmp/release.keystore || { echo "Keystore is empty; check the ANDROID_KEYSTORE_BASE64 secret"; exit 1; }

      - name: Build signed dev APKs
        env:
          ANDROID_KEYSTORE_FILE: /tmp/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DEV_TAG: ${{ needs.version.outputs.dev_tag }}
          DEV_CODE: ${{ needs.version.outputs.dev_code }}
        run: ./gradlew assembleDev --stacktrace -PversionName="${DEV_TAG#v}" -PversionCode="$DEV_CODE"

      - name: Rename APKs
        env:
          DEV_TAG: ${{ needs.version.outputs.dev_tag }}
        run: |
          cd app/build/outputs/apk/dev
          ls app-*-dev.apk >/dev/null 2>&1 || { echo "::error::No dev split APKs found in $(pwd)"; exit 1; }
          for f in app-*-dev.apk; do
            abi="${f#app-}"
            abi="${abi%-dev.apk}"
            mv "$f" "OpenCodePhone-${DEV_TAG}-${abi}.apk"
          done
          ls -la

      - name: Tag and publish the dev pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_TAG: ${{ needs.version.outputs.dev_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/${DEV_TAG}" >/dev/null 2>&1; then
            echo "Tag ${DEV_TAG} already exists (workflow rerun); reusing it"
          else
            git tag -a "${DEV_TAG}" -m "OpenCodePhone dev build ${DEV_TAG}"
            git push origin "${DEV_TAG}"
          fi
          SHORT_SHA=$(git rev-parse --short HEAD)
          if gh release view "${DEV_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${DEV_TAG}" app/build/outputs/apk/dev/OpenCodePhone-*.apk --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${DEV_TAG}" app/build/outputs/apk/dev/OpenCodePhone-*.apk \
              --repo "${GITHUB_REPOSITORY}" \
              --prerelease \
              --title "OpenCodePhone Dev ${DEV_TAG}" \
              --notes "Автоматическая dev-сборка из main (\`${SHORT_SHA}\`).

          Отдельное приложение **OpenCodePhone Dev** — ставится рядом со стабильной версией и ничего не заменяет.
          Встроенный авто-апдейтер учитывает только стабильные релизы: dev-обновления ставятся вручную из этого пререлиза."
          fi

  stable:
    name: Signed stable release APKs
    runs-on: ubuntu-latest
    needs: version
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          test -s /tmp/release.keystore || { echo "Keystore is empty; check the ANDROID_KEYSTORE_BASE64 secret"; exit 1; }

      - name: Run unit tests and build signed release APKs
        env:
          ANDROID_KEYSTORE_FILE: /tmp/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STABLE_TAG: ${{ needs.version.outputs.stable_tag }}
          STABLE_CODE: ${{ needs.version.outputs.stable_code }}
        run: ./gradlew test assembleRelease --stacktrace -PversionName="${STABLE_TAG#v}" -PversionCode="$STABLE_CODE"

      - name: Rename APKs
        env:
          STABLE_TAG: ${{ needs.version.outputs.stable_tag }}
        run: |
          cd app/build/outputs/apk/release
          ls app-*-release.apk >/dev/null 2>&1 || { echo "::error::No release split APKs found in $(pwd)"; exit 1; }
          for f in app-*-release.apk; do
            abi="${f#app-}"
            abi="${abi%-release.apk}"
            mv "$f" "OpenCodePhone-${STABLE_TAG}-${abi}.apk"
          done
          ls -la

      - name: Tag and publish the stable release
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_TAG: ${{ needs.version.outputs.stable_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/${STABLE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${STABLE_TAG} already exists (workflow rerun or manual tag); reusing it"
          else
            git tag -a "${STABLE_TAG}" -m "OpenCodePhone ${STABLE_TAG}"
            git push origin "${STABLE_TAG}"
          fi
          if gh release view "${STABLE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${STABLE_TAG}" app/build/outputs/apk/release/OpenCodePhone-*.apk --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${STABLE_TAG}" app/build/outputs/apk/release/OpenCodePhone-*.apk \
              --repo "${GITHUB_REPOSITORY}" \
              --title "OpenCodePhone ${STABLE_TAG}" \
              --generate-notes \
              --latest
          fi
